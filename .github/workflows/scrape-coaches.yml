name: Scrape football coaches

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/football/scrape-coaches.mjs'
      - '.github/workflows/scrape-coaches.yml'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install cheerio only
        run: npm install --no-save --ignore-scripts cheerio@1
      - name: Scrape all FBS + FCS programs
        run: node scripts/football/scrape-coaches.mjs scripts/data/coaches/scraped.json
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/data/coaches/scraped.json
          git commit -m "Coach scrape results [skip ci]" || echo "no changes"
          git push
