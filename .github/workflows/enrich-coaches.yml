name: Enrich football coach emails

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/football/enrich-coaches.mjs'
      - '.github/workflows/enrich-coaches.yml'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts cheerio@1
      - name: Second pass (bio pages, staff directories, retries)
        run: node scripts/football/enrich-coaches.mjs
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/data/coaches/enriched.json
          git commit -m "Coach enrichment results [skip ci]" || echo "no changes"
          git pull --rebase
          git push
